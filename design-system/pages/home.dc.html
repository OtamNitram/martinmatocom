<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Martín Mato · Blog</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/martins-web/components/bundle.css">
<script src="ds/martins-web/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=Space+Mono&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,500&amp;display=swap">
<style>
:root{--surfaces-white:#fafafa;--surfaces-highlights:#f2f6f8;--surfaces-strokes:#cdd8df;--surfaces-elevation:#7a8b99;--surfaces-elevation-20:rgba(122,139,153,0.2);--surfaces-divider:#364552;--text-primary:#121b27;--text-secondary:#364552;--text-contrast:#f2f6f8;--button-dark:#013345;--button-mid:#216375;--button-light:#3d9c9a;--accent:#22d48d;--teal-500:#3d9c9a;--text-highlight:#3d9c9a;--font-mono:"Space Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;--font-serif:"Source Serif 4",Georgia,"Times New Roman",serif;--font-sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--space-xxs:4px;--space-xs:8px;--space-s:12px;--space-m:16px;--space-l:24px;--space-xl:32px;--space-xxl:96px;--space-l-mobile:16px;--radius-none:0px;--radius-card:8px;--shadow-elevation:0px 4px 4px 0px rgba(122,139,153,0.2);--shadow-highlights:0px 0px 15px 0px rgba(54,69,82,0.2);--measure-reading:680px;--measure-page:800px}
body{margin:0;background:#fafafa}
.page{gap:32px}
.t-h1{font-size:48px}
.t-body{font-size:20px}
.t-eyebrow{font-size:18px}
@media (max-width: 600px){.page{gap:32px}.t-h1{font-size:36px}.t-body{font-size:16px}.t-eyebrow{font-size:14px}.intro-top{padding-top:48px !important}}
</style>
</helmet>
<div class="page" style="gap: 32px; min-height: 100vh; display: flex; flex-direction: column; background: var(--surfaces-white); color: var(--text-primary); font-family: var(--font-serif)">

<div style="position: relative; z-index: 1">
<x-import component-from-global-scope="MartinsWeb.Header" device="{{device}}" home-href="Main.dc.html" links="{{navLinks}}" on-menu="{{toggleMenu}}"></x-import>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
<nav aria-label="Main (mobile)" style="position: absolute; left: 0; right: 0; top: 100%; display: flex; flex-direction: column; gap: 4px; padding: 16px; background: var(--surfaces-white); border-top: 1px solid var(--surfaces-strokes); box-shadow: var(--shadow-elevation)">
<x-import component-from-global-scope="MartinsWeb.Link" href="Main.dc.html" current="{{yes}}">Blog</x-import>
<x-import component-from-global-scope="MartinsWeb.Link" href="About.dc.html">About</x-import>
<x-import component-from-global-scope="MartinsWeb.Link" href="About.dc.html#contact">Contact</x-import>
</nav>
</sc-if>
</div>

<main style="width: 100%; max-width: 832px; margin: 0 auto; box-sizing: border-box; padding: 0 16px; flex-grow: 1; display: flex; flex-direction: column; gap: 32px">

<section class="intro-top" style="display: flex; flex-direction: column; gap: 16px; padding-top: 96px; padding-bottom: 32px">
<p class="t-eyebrow" style="margin: 0; font-family: var(--font-mono); line-height: 1.35; text-transform: uppercase; color: var(--text-primary)">Talking Dev</p>
<h1 class="t-h1" style="margin: 0; font-weight: 700; line-height: 48px">Stories about leading teams,<br><span style="color: var(--text-highlight)">without the armor</span></h1>
<p class="t-body" style="margin: 0; line-height: 1.35">Personal essays on leading teams, mentoring people and bringing AI into my team. Nothing here is a rule, and all of it is up for debate.</p>
</section>

<x-import component-from-global-scope="MartinsWeb.TagFilter" tags="{{topics}}" value="{{topic}}" on-change="{{pickTopic}}" count="{{count}}"></x-import>

<sc-if value="{{hasPosts}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 32px">
<sc-for list="{{posts}}" as="p" hint-placeholder-count="3">
<sc-if value="{{p.notFirst}}" hint-placeholder-val="{{false}}">
<hr style="width: 100%; margin: 0; border: 0; border-top: 1px solid var(--surfaces-divider)">
</sc-if>
<x-import component-from-global-scope="MartinsWeb.PostCard" title="{{p.title}}" href="{{p.href}}" tags="{{p.tags}}" date="{{p.date}}" read-time="{{p.readTime}}" excerpt="{{p.excerpt}}" highlight="{{p.highlight}}" featured="{{p.featured}}"></x-import>
</sc-for>
</div>
</sc-if>

<sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 24px">
<p class="t-body" style="margin: 0; line-height: 1.35">Nothing here yet on this topic. Try All.</p>
<x-import component-from-global-scope="MartinsWeb.Button" variant="secondary" on-click="{{showAll}}">Show All Posts</x-import>
</div>
</sc-if>

<div style="display: flex; justify-content: center; padding-bottom: 32px">
<x-import component-from-global-scope="MartinsWeb.Button" variant="secondary" href="Archive.dc.html">Older Entries</x-import>
</div>

</main>

<x-import component-from-global-scope="MartinsWeb.Footer" device="{{device}}" links="{{footerLinks}}"></x-import>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":2700}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { topic: 'All', menuOpen: false, device: (typeof window !== 'undefined' && window.innerWidth <= 600) ? 'mobile' : 'desktop' };
this.onResize = this.onResize.bind(this);
}
componentDidMount() { window.addEventListener('resize', this.onResize); }
componentWillUnmount() { window.removeEventListener('resize', this.onResize); }
onResize() {
var d = window.innerWidth <= 600 ? 'mobile' : 'desktop';
if (d !== this.state.device) this.setState({ device: d, menuOpen: false });
}
renderVals() {
var self = this;
var s = this.state;
var all = [
{ title: 'The armor I called confidence.', href: 'Post.dc.html', topic: 'Personal', date: 'Oct 25, 2026', readTime: '4 min read',
excerpt: 'Nine months into my first job as a junior developer, I was called into a meeting nobody wants to have. I was at the top of the layoff list. I was blaming everyone and everything instead of looking at my part of the problem.',
highlight: 'My arrogance wasn’t confidence. It was the only way I knew to avoid asking for help.' },
{ title: 'Use of AI bots in meetings', href: 'Post.dc.html', topic: 'AI in Teams', date: 'Sept 9, 2026', readTime: '[X] min read',
excerpt: 'Installing an AI bot in a meeting is not the same as installing Big Brother. Or at least, it doesn’t have to be. A phrase by Amantha Imber helped me understand why I experience it differently from what I usually hear.',
highlight: null },
{ title: 'Artificial Harmony', href: 'Post.dc.html', topic: 'Leading Teams', date: 'Sept 9, 2026', readTime: '[X] min read',
excerpt: 'I’ve been thinking a lot these days about the concept of “artificial harmony.” Patrick Lencioni describes it brilliantly in Five Dysfunctions of a Team. It happens a lot in our industry: entire teams take refuge in technical urgency to avoid dealing with their dynamics.',
highlight: 'The state a team falls into when it simply lacks the tools to face conflict.' }
];
var list = all.filter(function (p) { return s.topic === 'All' || p.topic === s.topic; });
var posts = list.map(function (p, i) {
return { title: p.title, href: p.href, tags: [p.topic], date: p.date, readTime: p.readTime, excerpt: p.excerpt, highlight: p.highlight, featured: i === 0, notFirst: i > 0 };
});
return {
yes: true,
device: s.device,
menuOpen: s.menuOpen,
toggleMenu: function () { self.setState({ menuOpen: !self.state.menuOpen }); },
navLinks: [{ label: 'Blog', href: 'Main.dc.html', current: true }, { label: 'About', href: 'About.dc.html' }, { label: 'Contact', href: 'About.dc.html#contact' }],
footerLinks: [{ label: 'Posts', href: 'Archive.dc.html' }, { label: 'About', href: 'About.dc.html' }, { label: 'Contact', href: 'About.dc.html#contact' }, { label: 'RSS', href: '#' }],
topics: ['Personal', 'Leading Teams', 'Mentoring', 'AI in Teams'],
topic: s.topic,
pickTopic: function (t) { self.setState({ topic: t }); },
showAll: function () { self.setState({ topic: 'All' }); },
count: posts.length,
posts: posts,
hasPosts: posts.length > 0,
isEmpty: posts.length === 0
};
}
}
</script>
</body>
</html>
